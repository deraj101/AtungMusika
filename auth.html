<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ATUNG MUSIKA - Login/Signup</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="min-h-screen flex flex-col bg-gray-900 text-white">
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <span class="flex items-center justify-center">
                    <i class="bx bx-pulse mr-2 text-purple-500 glow text-3xl"></i>
                    <span class="text-4xl italic font-bold text-purple-500">A</span>
                    <span class="text-2xl font-bold">TUNG MUSIKA</span>
                </span>
            </div>

            <!-- Auth Forms Container -->
            <div class="bg-gray-800 rounded-lg p-8 shadow-lg">
                <!-- Login Form -->
                <div id="login-form" class="animate-fade-in">
                    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Email</label>
                            <input type="email" id="loginEmail" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Password</label>
                            <input type="password" id="loginPassword" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition">
                            Login
                        </button>
                    </form>
                    <p class="mt-4 text-center text-sm">
                        Don't have an account? 
                        <a href="#" id="showSignup" class="text-purple-400 hover:text-purple-300">Sign up</a>
                    </p>
                </div>

                <!-- Signup Form -->
                <div id="signup-form" class="hidden animate-fade-in">
                    <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
                    <form id="signupForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Name</label>
                            <input type="text" id="signupName" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email</label>
                            <input type="email" id="signupEmail" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Password</label>
                            <input type="password" id="signupPassword" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Confirm Password</label>
                            <input type="password" id="signupConfirmPassword" required
                                class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition appearance-none">
                        </div>
                        <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition">
                            Sign Up
                        </button>
                    </form>
                    <p class="mt-4 text-center text-sm">
                        Already have an account? 
                        <a href="#" id="showLogin" class="text-purple-400 hover:text-purple-300">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
